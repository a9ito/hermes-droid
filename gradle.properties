# Project-wide Gradle settings.

# JVM args for the Gradle daemon. AGP 9.x + Kotlin need headroom.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX (mandatory for modern Compose).
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Only keep resources for locales we actually ship (en + in), plus enable
# non-transitive R classes for faster, smaller builds.
android.nonTransitiveRClass=true

# Enable configuration cache + parallel + caching for faster CI builds.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
