[versions]
# --- Build toolchain (verified latest-stable against live Maven metadata, 2026-09-27) ---
agp = "9.4.1"                      # latest stable AGP; requires Gradle 9.6.0 + JDK 17, max API 37
kotlin = "2.2.20"                  # stable Kotlin; compose-compiler + serialization plugins ship for it
ks-serialization-json = "1.9.0"
coroutines = "1.10.2"

# --- AndroidX / Compose ---
# Compose BOM 2026.06.01 pins ui/runtime/foundation 1.11.4 + material3 1.4.0 (all minCompileSdk<=35),
# so the whole Compose stack builds cleanly on compileSdk 36. Newer BOMs jump ui to 1.12 (minCompileSdk 37).
compose-bom = "2026.06.01"
androidx-core = "1.17.0"           # minCompileSdk 36
androidx-activity = "1.13.0"       # activity-compose, minCompileSdk 36
androidx-lifecycle = "2.9.4"       # viewmodel-compose + runtime-compose, minCompileSdk 35
androidx-navigation = "2.9.8"      # navigation-compose, minCompileSdk 35 (2.10.x needs 37)
androidx-datastore = "1.2.1"       # datastore-preferences, minCompileSdk 34

# --- Networking ---
retrofit = "3.0.0"
okhttp = "4.12.0"                  # the version Retrofit 3.0.0 itself depends on

# --- Test ---
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }

# Compose (versions come from the BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidx-navigation" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidx-datastore" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "ks-serialization-json" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
